[package]
name = "solana-jupiter-dashboard"
version = "0.1.0"
description = "SolJup — Self-optimizing Solana TA dashboard"
authors = ["you"]
edition = "2021"

[lib]
name = "solana_jupiter_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
